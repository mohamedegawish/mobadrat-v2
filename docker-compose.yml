# Production deployment of the National Industrial Initiatives Platform — Docker Compose
# (Coolify: build pack "Docker Compose", file /docker-compose.yml; any Docker host: `docker compose up -d --build`).
#
#   app    Node.js backend + the built frontend on one origin, port 4000 (the only service that gets a domain). Serves the
#          platform and every initiative module (Shams El-Senaa, Sona'a El-Mostaqbal) and runs the background jobs in-process
#          (notification outbox, module webhooks, SLA monitors).
#   mysql  MySQL 8.4 LTS — internal only (no published port), data in the mysql-data volume.
#
# No `ports:` on purpose: the reverse proxy reaches `app` on the internal network.
#
# Coolify: nothing to fill in. Coolify's generated values (SERVICE_URL_* / SERVICE_PASSWORD_*) give the domain, the MySQL
# passwords, JWT_SECRET and the first-sign-in password of the seeded accounts; they persist across deployments and are
# listed (editable) under the resource's Environment Variables. A value you set there yourself always wins.
# On the first start the app creates one account for every role (SEED_ON_DEPLOY, docs/DEPLOY.md «حسابات لكل دور»).
# Any other Docker host: put APP_URL, CORS_ORIGIN, SERVICE_PASSWORD_MYSQL and SERVICE_PASSWORD_MYSQLROOT in .env
# (JWT_SECRET and the seed password are then generated by the app into the app-data volume) → docker compose up -d --build

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # Coolify: a generated https domain routed to port 4000 of this service (your own domain set in the resource's
      # Domains replaces it; APP_URL and CORS_ORIGIN below follow it).
      SERVICE_URL_APP_4000: /
      # ── fixed for this deployment (not secrets) ──
      NODE_ENV: production
      PORT: "4000"
      HOST: 0.0.0.0
      SERVE_FRONTEND: "1"
      TRUST_PROXY: "1"
      UPLOAD_DIR: /data/uploads
      DB_HOST: mysql
      DB_PORT: "3306"
      # Secrets the app generates on its first start when the environment leaves them empty (kept in the app-data volume).
      SECRETS_DIR: /data/secrets
      # ── accounts: one for every role of the platform and of each initiative + the demo data they need, created on the
      #    first start (any missing one on later starts); never changes an existing account. Each account signs in once
      #    with SEED_PASSWORD (Coolify: SERVICE_PASSWORD_SEED under Environment Variables) and then sets its own password.
      SEED_ON_DEPLOY: ${SEED_ON_DEPLOY:-1}
      SEED_PASSWORD: ${SEED_PASSWORD:-${SERVICE_PASSWORD_SEED}}
      SEED_EMAIL_DOMAIN: ${SEED_EMAIL_DOMAIN:-}
      SEED_ON_BOOT: ${SEED_ON_BOOT:-0}
      # ── database: MySQL 8.4, the mysql service below (same user and password on both sides) ──
      DB_NAME: ${MYSQL_DATABASE:-mobadrat}
      DB_USER: ${MYSQL_USER:-mobadrat}
      DB_PASSWORD: ${MYSQL_PASSWORD:-${SERVICE_PASSWORD_MYSQL}}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_CONNECT_TIMEOUT_MS: ${DB_CONNECT_TIMEOUT_MS:-120000}
      DB_TX_LOCK_TIMEOUT_SEC: ${DB_TX_LOCK_TIMEOUT_SEC:-10}
      # password-check workers (empty = cores − 1, at most 4 ≈ 40 sign-ins/s); raise on a server with more cores
      PASSWORD_POOL_SIZE: ${PASSWORD_POOL_SIZE:-}
      # ── public URL and secrets ──
      APP_URL: ${APP_URL:-${SERVICE_URL_APP_4000}}
      CORS_ORIGIN: ${CORS_ORIGIN:-${SERVICE_URL_APP_4000}}
      JWT_SECRET: ${JWT_SECRET:-${SERVICE_PASSWORD_64_JWT}}
      JWT_ACCESS_TTL_SEC: ${JWT_ACCESS_TTL_SEC:-900}
      JWT_REFRESH_TTL_SEC: ${JWT_REFRESH_TTL_SEC:-604800}
      # ── Shams El-Senaa: industrial registry ──
      # manual (default until the registry API is connected): factories register normally and upload their industrial
      # registry certificate; IMC checks the number against it. http + REGISTRY_API_URL/KEY: automatic verification.
      # mock is for development only (refused in production unless ALLOW_MOCK_REGISTRY_IN_PRODUCTION=1).
      REGISTRY_ADAPTER: ${REGISTRY_ADAPTER:-manual}
      ALLOW_MOCK_REGISTRY_IN_PRODUCTION: ${ALLOW_MOCK_REGISTRY_IN_PRODUCTION:-0}
      REGISTRY_API_URL: ${REGISTRY_API_URL:-}
      REGISTRY_API_KEY: ${REGISTRY_API_KEY:-}
      REGISTRY_TIMEOUT_MS: ${REGISTRY_TIMEOUT_MS:-8000}
      # ── mail (SMTP, or Gmail with an app password) ──
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-0}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-المنصة الوطنية للمبادرات الصناعية}
      SONA3_MAIL_FROM_NAME: ${SONA3_MAIL_FROM_NAME:-}
      GMAIL_USER: ${GMAIL_USER:-}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}
      # ── official enquiry channel (shown on the site; check:readiness requires both) ──
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
      SUPPORT_PHONE: ${SUPPORT_PHONE:-}
      # ── optional integrations ──
      SMS_PROVIDER: ${SMS_PROVIDER:-}
      SMS_API_URL: ${SMS_API_URL:-}
      SMS_API_KEY: ${SMS_API_KEY:-}
      SMS_SENDER: ${SMS_SENDER:-}
      # Outbound state-change webhooks of each module (off when empty).
      SHAMS_WEBHOOK_URL: ${SHAMS_WEBHOOK_URL:-}
      SHAMS_WEBHOOK_SECRET: ${SHAMS_WEBHOOK_SECRET:-}
      SONA3_WEBHOOK_URL: ${SONA3_WEBHOOK_URL:-}
      SONA3_WEBHOOK_SECRET: ${SONA3_WEBHOOK_SECRET:-}
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-15}
      # e-mail/SMS outbox retention in days for finished messages (sent/skipped/failed); 0 = keep forever (default)
      NOTIFICATION_OUTBOX_RETENTION_DAYS: ${NOTIFICATION_OUTBOX_RETENTION_DAYS:-0}
    volumes:
      # Uploaded documents (core/, shams/, sona3/) and the secrets generated on the first start (secrets/).
      - app-data:/data
    expose:
      - "4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    stop_grace_period: 30s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  mysql:
    image: mysql:8.4.11
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mobadrat}
      MYSQL_USER: ${MYSQL_USER:-mobadrat}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-${SERVICE_PASSWORD_MYSQL}}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-${SERVICE_PASSWORD_MYSQLROOT}}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_bin
      - --default-time-zone=+00:00
      # Lets the application user create the schema's triggers while binary logging is on (MySQL 8.4 default).
      - --log-bin-trust-function-creators=1
      # Binary logs (point-in-time recovery) kept 7 days, to bound disk use on a small server.
      - --binlog-expire-logs-seconds=604800
      - --innodb-buffer-pool-size=${MYSQL_INNODB_BUFFER_POOL_SIZE:-256M}
      - --max-connections=${MYSQL_MAX_CONNECTIONS:-100}
      - --skip-name-resolve
    volumes:
      - mysql-data:/var/lib/mysql
    # internal only: no `ports:` — reachable from `app` as mysql:3306 on the compose network
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    stop_grace_period: 60s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

volumes:
  app-data:
  mysql-data:
